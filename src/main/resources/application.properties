# ?? Server ??????????????????????????????????????????????????????????
# The port your app runs on. Visit: http://localhost:8080
server.port=9081


spring.datasource.url=jdbc:mysql://localhost:3306/sakila?useSSL=false&serverTimezone=UTC
spring.application.name=File-Rental-System
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ??????????????????????????????????????????????????
# dialect tells Hibernate which SQL "dialect" to use (MySQL vs PostgreSQL etc.)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto=update means: on startup, Hibernate will look at your Java entity
# classes and automatically CREATE or ALTER the database tables to match.
# Options: none | validate | update | create | create-drop
# For learning, "update" is safe. In production you'd use "none" or "validate".
spring.jpa.hibernate.ddl-auto=none


# ?? Jackson (JSON) ???????????????????????????????????????????????????
# For REST endpoints: format dates nicely in JSON responses
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.cache=false


# ===============================
# LOGGING (Optional but helpful)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.jpa.show-sql=true


