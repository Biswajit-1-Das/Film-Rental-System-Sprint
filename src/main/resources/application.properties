# ?? Server ??????????????????????????????????????????????????????????
# The port your app runs on. Visit: http://localhost:8080
server.port=6065

# ?? MySQL Database ???????????????????????????????????????????????????
# Make sure you create a database called "job_portal" in MySQL first:
#   CREATE DATABASE job_portal;
spring.datasource.url=jdbc:mysql://localhost:3306/sakila?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=tiger
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ??????????????????????????????????????????????????
# dialect tells Hibernate which SQL "dialect" to use (MySQL vs PostgreSQL etc.)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto=update means: on startup, Hibernate will look at your Java entity
# classes and automatically CREATE or ALTER the database tables to match.
# Options: none | validate | update | create | create-drop
# For learning, "update" is safe. In production you'd use "none" or "validate".
spring.jpa.hibernate.ddl-auto=none

# Show the SQL queries Hibernate runs in the console ? great for learning!
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ?? JSP View Resolver ????????????????????????????????????????????????
# This tells Spring: when a controller returns a view name like "home",
# look for the file at: /WEB-INF/views/home.jsp
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ?? Jackson (JSON) ???????????????????????????????????????????????????
# For REST endpoints: format dates nicely in JSON responses
spring.jackson.serialization.write-dates-as-timestamps=false