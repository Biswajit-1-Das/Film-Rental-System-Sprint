<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${member.name} + ' — Endpoints'">Member Endpoints</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080810;
    --surface: #0f0f1a;
    --card: #161625;
    --text: #eeeef8;
    --muted: #66667a;
    --border: #22223a;
    --get:    #47ffc8;
    --post:   #e8ff47;
    --put:    #ffaa47;
    --delete: #ff6b6b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    opacity: 0.5;
  }

  /* ── Header ────────────────────────────────────────────────────────── */
  .header {
    position: relative; z-index: 1;
    padding: 40px 64px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 24px;
    animation: rise 0.5s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .back-btn {
    text-decoration: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 9px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .back-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .header-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: var(--card);
    border: 2px solid var(--accent);
    flex-shrink: 0;
  }

  .header-info {}

  .header-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px; letter-spacing: 2px; line-height: 1;
    color: var(--accent);
  }

  .header-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-top: 4px;
  }

  /* ── Content ───────────────────────────────────────────────────────── */
  .content {
    position: relative; z-index: 1;
    padding: 48px 64px 80px;
    display: flex; flex-direction: column; gap: 36px;
    animation: rise 0.6s cubic-bezier(0.16,1,0.3,1) 0.08s both;
  }

  .entity-block {}

  .entity-heading {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }

  .entity-heading::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }

  .endpoints-list {
    display: flex; flex-direction: column; gap: 6px;
  }

  .ep-link {
    text-decoration: none;
    display: flex; align-items: center; gap: 14px;
    padding: 13px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    transition: all 0.22s ease;
    position: relative; overflow: hidden;
  }

  .ep-link::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0; background: var(--accent);
    opacity: 0.1;
    transition: width 0.25s ease;
  }

  .ep-link:hover {
    border-color: var(--accent);
    transform: translateX(5px);
    background: var(--card);
  }

  .ep-link:hover::before { width: 100%; }
  .ep-link:hover .ep-chevron { opacity: 1; transform: translateX(0); color: var(--accent); }

  .method-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 500; letter-spacing: 1px;
    padding: 3px 9px; border-radius: 3px;
    min-width: 58px; text-align: center;
    flex-shrink: 0;
  }

  .GET    { background: rgba(71,255,200,0.1);  color: var(--get); }
  .POST   { background: rgba(232,255,71,0.1);  color: var(--post); }
  .PUT    { background: rgba(255,170,71,0.1);  color: var(--put); }
  .DELETE { background: rgba(255,107,107,0.1); color: var(--delete); }

  .ep-path {
    font-family: 'DM Mono', monospace;
    font-size: 13px; color: var(--text);
    flex: 1; position: relative; z-index: 1;
  }

  .ep-desc {
    font-size: 12px; color: var(--muted);
    flex: 1.2; position: relative; z-index: 1;
  }

  .ep-chevron {
    color: var(--muted); font-size: 18px;
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity 0.2s, transform 0.2s, color 0.2s;
    position: relative; z-index: 1;
  }

  @media (max-width: 800px) {
    .header, .content { padding-left: 24px; padding-right: 24px; }
    .ep-desc { display: none; }
  }
</style>
</head>
<body th:style="'--accent:' + ${member.color}">

<header class="header">
  <a href="/team" class="back-btn">← Team</a>
  <div class="header-avatar" th:text="${member.emoji}">🎬</div>
  <div class="header-info">
    <div class="header-name" th:text="${member.name}">Name</div>
    <div class="header-meta"
         th:text="${member.role} + ' · ' + ${member.entities.size()} + ' entities'">
      Role · N entities
    </div>
  </div>
</header>

<div class="content">

  <div class="entity-block" th:each="entity : ${member.entities}">

    <div class="entity-heading" th:text="${entity.name}">Entity</div>

    <div class="endpoints-list">
      <a class="ep-link"
         th:each="ep, epStat : ${entity.endpoints}"
         th:href="@{/team/{mi}/endpoint(mi=${member.index}, entity=${entity.name}, epIndex=${epStat.index})}"
         th:data-method="${ep.method}">

        <span class="method-badge" th:classappend="${ep.method}" th:text="${ep.method}">GET</span>
        <span class="ep-path" th:text="${ep.path}">/api/path</span>
        <span class="ep-desc" th:text="${ep.desc}">Description</span>
        <span class="ep-chevron">›</span>

      </a>
    </div>

  </div>

</div>

</body>
</html>
